# Edge case - searching for products not in catalog

task_id: "edge_empty_001"
name: "Search for non-existent product category"
type: "edge_case"
category: "edge_case"

turns:
  - user: "Show me laptops"

init:
  cart: []
  context: ""

verify:
  routing:
    expected: "retriever"
  response:
    not_empty: true
    contains_any:
      - "sorry"
      - "don't have"
      - "not available"
      - "couldn't find"
      - "no "

failure_modes:
  - "wrong_routing"
  - "hallucinated_products"
  - "poor_response"

tags:
  - "edge_case"
  - "empty_results"

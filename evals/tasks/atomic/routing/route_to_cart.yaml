# Routing test - verify planner routes cart operations to cart agent

task_id: "route_cart_001"
name: "Route add-to-cart to cart agent"
type: "atomic"
category: "routing"

turns:
  - user: "Add this to my cart"

init:
  cart: []
  context: "User was just shown the Summer Floral Dress"

verify:
  routing:
    expected: "cart"
  response:
    not_empty: true

failure_modes:
  - "wrong_routing"

tags:
  - "routing"
  - "cart"

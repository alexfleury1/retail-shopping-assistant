# Search test - Search for bags/purses

task_id: "search_bag_001"
name: "Search for handbags"
type: "atomic"
category: "search"

turns:
  - user: "Show me some handbags"

init:
  cart: []
  context: ""

verify:
  routing:
    expected: "retriever"
  retrieved:
    min_count: 1
  response:
    not_empty: true
    contains_any:
      - "bag"
      - "Bag"
      - "purse"
      - "Purse"
      - "clutch"
      - "Clutch"

failure_modes:
  - "wrong_routing"
  - "no_results"

tags:
  - "search"
  - "accessories"
  - "bag"

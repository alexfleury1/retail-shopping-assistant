# Composed task - Multi-turn outfit building conversation
# Converted from tests/examples/conv_0.yaml

task_id: "composed_outfit_001"
name: "Build an outfit with multiple items"
type: "composed"
category: "end_to_end"

turns:
  - user: "I'm looking for an outfit for a special occasion."
    verify:
      routing:
        expected: "retriever"
      response:
        not_empty: true

  - user: "Do you have any skirts?"
    verify:
      routing:
        expected: "retriever"
      retrieved:
        min_count: 1
      response:
        not_empty: true
        contains_any:
          - "skirt"
          - "Skirt"
          - "Satin"
          - "Midi"

  - user: "What shoes would match?"
    verify:
      routing:
        expected: "retriever"
      response:
        not_empty: true
        contains_any:
          - "shoe"
          - "Shoe"
          - "heel"
          - "Heel"
          - "flat"
          - "Flat"
          - "sandal"
          - "Sandal"

  - user: "Show me some bags to complete the look."
    verify:
      routing:
        expected: "retriever"
      retrieved:
        min_count: 1
      response:
        not_empty: true
        contains_any:
          - "bag"
          - "Bag"
          - "purse"
          - "Purse"

init:
  cart: []
  context: ""

final_verify:
  response:
    not_empty: true

failure_modes:
  - "wrong_routing"
  - "no_results"
  - "context_lost"

max_turns: 4
timeout_seconds: 60

tags:
  - "end_to_end"
  - "multi_turn"
  - "outfit"
  - "converted"

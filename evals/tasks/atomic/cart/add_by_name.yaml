# Cart test - verify adding item by name

task_id: "cart_add_001"
name: "Add item to cart by name"
type: "atomic"
category: "cart"

turns:
  - user: "Add the Satin Effect Midi Skirt in Black to my cart"

init:
  cart: []
  context: "Previously shown products include the Satin Effect Midi Skirt in Black priced at $45.90"

verify:
  routing:
    expected: "cart"
  cart:
    length: 1
  response:
    not_empty: true
    contains_any:
      - "added"
      - "Added"
      - "cart"
      - "skirt"
      - "Skirt"

failure_modes:
  - "wrong_routing"
  - "cart_error"
  - "item_not_found"

tags:
  - "cart"
  - "add"

# Details test - verify asking about product price

task_id: "details_price_001"
name: "Ask about product price"
type: "atomic"
category: "details"

turns:
  - user: "How much does it cost?"

init:
  cart: []
  context: "User was just shown the Classic Black Patent Leather Purse priced at $49.90"

verify:
  routing:
    expected: "chatter"
  response:
    not_empty: true
    contains_any:
      - "$"
      - "49"
      - "price"
      - "costs"

failure_modes:
  - "wrong_routing"
  - "missing_price"

tags:
  - "details"
  - "price"

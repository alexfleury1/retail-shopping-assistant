# Search test - verify text search returns relevant products

task_id: "search_text_001"
name: "Search for skirts"
type: "atomic"
category: "search"

turns:
  - user: "Show me some skirts"

init:
  cart: []
  context: ""

verify:
  routing:
    expected: "retriever"
  retrieved:
    min_count: 1
  response:
    not_empty: true
    contains_any:
      - "skirt"
      - "Skirt"
      - "Satin"
      - "Midi"

failure_modes:
  - "wrong_routing"
  - "no_results"
  - "wrong_category"

tags:
  - "search"
  - "text"
  - "apparel"
